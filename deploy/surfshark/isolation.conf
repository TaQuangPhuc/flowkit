[Unit]
Requires=flowkit-gateway-netns.service
After=flowkit-gateway-netns.service

[Service]
NetworkNamespacePath=/run/netns/flowkit-gateway
PrivateMounts=yes
BindReadOnlyPaths=/etc/netns/flowkit-gateway/resolv.conf:/etc/resolv.conf
InaccessiblePaths=-/run/dbus -/run/systemd/resolve
# The old cleanup deleted every named namespace, including unrelated ones.
# Worker mounts now live in this service's private mount namespace; normal
# gateway Shutdown handles them and private mounts disappear on exit.
ExecStopPost=
